name: Daily OpenRouter snapshot

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run daily pipeline
        shell: bash
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            python -m advisor.pipeline
          else
            echo 'OPENROUTER_API_KEY is not configured; running public degraded mode'
            python -m advisor.pipeline --no-key
          fi
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              'shortlist.json',
              'data/latest.json',
              'data/gate_rejected.json',
              'data/rankings_surface.json',
              'data/decision_surface.json',
              'data/task_cost_evidence.json',
              'data/task_cost_coverage.json',
              'data/config_patch.json',
              'changes.json',
          ]
          for name in paths:
              value = json.loads(Path(name).read_text(encoding='utf-8'))
              print('valid', name, 'keys=', list(value)[:8])
          decision = json.loads(Path('data/decision_surface.json').read_text(encoding='utf-8'))
          if decision.get('ranking_mode') != 'rankings_cost_per_request':
              raise SystemExit('unexpected ranking mode')
          patch = json.loads(Path('data/config_patch.json').read_text(encoding='utf-8'))
          if patch.get('status') != 'not_applied' or patch.get('requires_confirmation') is not True:
              raise SystemExit('config patch must remain preview-only')
          PY
          git diff --check
      - name: Commit daily artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data shortlist.json report.md index.html changes.json
          git diff --cached --quiet || git commit -m "chore: daily OpenRouter MVP-1 snapshot"
          git push

# GitHub Pages must be configured once at repository level:
# Settings -> Pages -> Source: Deploy from a branch -> main / (root).
