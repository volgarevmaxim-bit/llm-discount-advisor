name: Daily OpenRouter snapshot

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run daily pipeline
        run: python -m advisor.pipeline --no-key
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ['shortlist.json', 'data/latest.json', 'data/gate_rejected.json']:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print('valid', path)
          PY
          git diff --check
      - name: Commit daily artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data shortlist.json report.md
          git diff --cached --quiet || git commit -m "chore: daily OpenRouter snapshot"
          git push

# GitHub Pages must be configured once at repository level:
# Settings -> Pages -> Source: Deploy from a branch -> main / (root).
